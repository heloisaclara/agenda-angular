<div>
    <label>Nome:</label>
    <input type="text" id="nome" #nome>
</div>

<div>
    <label>Telefone:</label>
    <input type="number" id="tel" #telefone>
</div>

<div>
    <label>Tipo</label>
    <select id="tipo" #tipo>
        <option value="Amigo(a)">Amigo(a)</option>
        <option value="Família">Família</option>
        <option value="Trabalho">Tabalho</option>
        <option value="Outro">Outro</option>
    </select>
</div>

<div>
    <input type="button" value="Adicionar" (click)="adicionar(nome.value, telefone.value, tipo.value)">
</div>

<table>
    <thead>
        <tr>
            <th>Nome</th>
            <th>Telefone</th>
            <th>Tipo</th>
        </tr>
    </thead>
    <tbody>
        @for (contato of contatos; track contato.nome){
        <tr>
            <td>{{contato.nome}}</td>
            <td>{{contato.telefone}}</td>
            <td>{{contato.tipo}}</td>
        </tr>
        }
    </tbody>
</table>
